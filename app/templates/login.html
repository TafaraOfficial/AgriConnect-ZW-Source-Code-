{% extends 'base.html' %}
{% block title %}Login | AgriConnect ZW{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to access the marketplace and manage your listings.</p>

  <form method="POST" class="form-panel">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="field-group">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required />
    </div>

    <div class="field-group">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Your password" required />
    </div>

    <button type="submit" class="primary-button">Login</button>
  </form>

  <p class="switch-link">Need an account? <a href="{{ url_for('main.register') }}">Register here</a></p>
</section>
{% endblock %}
